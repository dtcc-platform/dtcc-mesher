name: build-tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Install Python package and development dependencies
        run: uv sync --locked
      - name: Verify editable Python sources
        run: >-
          uv run --locked python -c
          "from pathlib import Path; import dtcc_mesher;
          assert Path(dtcc_mesher.__file__).resolve() == Path('python/dtcc_mesher/__init__.py').resolve()"
      - name: Run Python tests
        run: uv run --locked pytest
      - name: Build and test native library and CLI
        run: |
          cmake -S . -B build-native
          cmake --build build-native --config Release
          ctest --test-dir build-native -C Release --output-on-failure
      - name: Build distributions
        run: uv build
